<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Admin Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              600: '#4f46e5',
              500: '#6366f1'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md card-surface rounded-2xl p-8">
    <div class="text-center mb-8">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-primary-50 flex items-center justify-center text-primary text-2xl font-bold shadow-sm">
        A
      </div>
      <h1 class="mt-5 text-2xl font-bold text-slate-800">Acceso administrativo</h1>
      <p class="mt-2 text-sm text-slate-500">Inicia sesión para acceder al panel de asistencia.</p>
    </div>

    <form id="login-form" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Correo electrónico</label>
        <input id="email" type="email" required class="input-shell w-full rounded-xl px-4 py-3" placeholder="admin@tuempresa.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Contraseña</label>
        <input id="password" type="password" required class="input-shell w-full rounded-xl px-4 py-3" placeholder="••••••••" />
      </div>

      <button type="submit" id="login-btn" class="button-primary w-full rounded-xl px-4 py-3 font-semibold shadow-sm">
        Iniciar sesión
      </button>
    </form>

    <div id="login-status" class="mt-5 hidden rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.0/dist/umd/supabase.min.js" integrity="sha384-H0+N1qRk/NwJYowrscC9J1eUv1Bi9XcSadS2n+W7zIAhXfr2ay0X+sRLx93DUWkQ" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const statusEl = document.getElementById('login-status');
    const btn = document.getElementById('login-btn');

    const hasSupabaseConfig = typeof window.isSupabaseClientConfigValid === 'function'
      ? window.isSupabaseClientConfigValid()
      : Boolean(window.SUPABASE_URL && window.SUPABASE_ANON_KEY);
    const supabase = window.supabase && hasSupabaseConfig
      ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
      : null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('hidden', !message);
      statusEl.classList.toggle('bg-red-50', isError);
      statusEl.classList.toggle('border-red-200', isError);
      statusEl.classList.toggle('text-red-600', isError);
      statusEl.classList.toggle('bg-emerald-50', !isError);
      statusEl.classList.toggle('border-emerald-200', !isError);
      statusEl.classList.toggle('text-emerald-600', !isError);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!supabase) {
        setStatus('Configuración de Supabase inválida. Revisa SUPABASE_URL y SUPABASE_ANON_KEY en assets/js/config.js.', true);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Iniciando sesión...';
      setStatus('');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        setStatus(error.message || 'No se pudo iniciar sesión.', true);
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
        return;
      }

      const user = data?.user;
      if (!user) {
        setStatus('La sesión no fue creada correctamente.', true);
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
        return;
      }

      window.localStorage.setItem('supabase_session', JSON.stringify(data.session));
      window.localStorage.setItem('supabase_user', JSON.stringify(user));
      setStatus('Acceso correcto. Redirigiendo...');
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
